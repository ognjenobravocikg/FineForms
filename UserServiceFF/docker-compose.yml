services:

  user-db:
    image: postgres:latest
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: fineformsdb
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

volumes:
  user-db-data: