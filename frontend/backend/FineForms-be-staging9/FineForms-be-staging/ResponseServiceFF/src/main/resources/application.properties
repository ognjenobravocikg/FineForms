spring.application.name=ResponseServiceFF

server.port=8050
form.service.url=http://localhost:8060

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=basic

feign.circuitbreaker.enabled=true

spring.datasource.url=${RESPONSE_DB_URL}
spring.datasource.username=${RESPONSE_DB_USERNAME}
spring.datasource.password=${RESPONSE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect